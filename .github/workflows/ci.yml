name: CI

on:
    pull_request:
        branches: [main, dev]
        types: [opened, reopened, synchronize, edited, ready_for_review]
    push:
        branches: [main, dev]

permissions:
    contents: read

jobs:
    package-changes:
        name: Detect packaging changes
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            relevant: ${{ steps.changes.outputs.relevant }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 0
                  persist-credentials: false
            - name: Check build inputs changed by the PR
              id: changes
              shell: bash
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/pond-changed-files"
                  relevant=false
                  while IFS= read -r -d '' path; do
                      case "$path" in
                          src/*|install.sh|tools/installer/*|tools/packaging/*|tools/release/*|.github/workflows/*|package.json|bun.lock|bun.lockb|tsconfig*.json|bunfig.toml|.bun-version|.npmrc|.gitattributes|LICENSE*)
                              relevant=true
                              break
                              ;;
                      esac
                  done < "$RUNNER_TEMP/pond-changed-files"
                  echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

    packages:
        needs: package-changes
        if: github.event_name == 'pull_request' && needs.package-changes.outputs.relevant == 'true'
        uses: ./.github/workflows/package.yml
        with:
            ref: ${{ github.event.pull_request.head.sha }}

    release-metadata:
        name: Release metadata
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
            pull-requests: read
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.4.2'

            - run: bun install --frozen-lockfile

            - name: Validate prepared release
              run: bun tools/release/prepare.ts check
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_PR_NUMBER: ${{ github.event.pull_request.number }}

    checks:
        name: Checks
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.4.2'

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check TypeScript
              run: bun run typecheck

            - name: Lint source and tooling
              run: bun run lint

            - name: Test
              run: bun run test

            - name: Check formatting
              run: bun run format:check
