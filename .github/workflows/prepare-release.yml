name: Prepare release

on:
    pull_request:
        branches: [main]
        types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
    contents: read
    pull-requests: read

concurrency:
    group: prepare-release
    cancel-in-progress: false

jobs:
    prepare:
        if: >-
            github.event.pull_request.head.ref == 'dev' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            !github.event.pull_request.draft
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.4.2'

            - run: bun install --frozen-lockfile

            - name: Prepare version and changelog
              run: bun tools/release/prepare.ts prepare
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_PR_NUMBER: ${{ github.event.pull_request.number }}

            - name: Check for release file changes
              id: changes
              run: |
                  git add package.json .release.json CHANGELOG.md
                  if git diff --cached --quiet; then
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Create release bot token
              if: steps.changes.outputs.changed == 'true'
              id: bot
              uses: actions/create-github-app-token@v3
              with:
                  client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  permission-contents: write

            - name: Commit release files to dev
              if: steps.changes.outputs.changed == 'true'
              env:
                  GH_TOKEN: ${{ steps.bot.outputs.token }}
              run: |
                  gh auth setup-git
                  git config user.name 'pond-release[bot]'
                  git config user.email 'pond-release[bot]@users.noreply.github.com'
                  git commit -m 'chore(release): prepare version and changelog'
                  git push origin HEAD:refs/heads/dev
